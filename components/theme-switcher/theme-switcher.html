<div class="theme-switcher" role="group" aria-label="Seletor de tema">
  <button type="button" class="theme-btn" data-theme-value="system" title="Seguir tema do sistema">
    <span class="theme-icon-slot" data-icon-slot="system"></span>
    <span>Sistema</span>
  </button>

  <button type="button" class="theme-btn" data-theme-value="dark" title="Modo escuro">
    <span class="theme-icon-slot" data-icon-slot="dark"></span>
    <span>Escuro</span>
  </button>

  <button type="button" class="theme-btn" data-theme-value="light" title="Modo claro">
    <span class="theme-icon-slot" data-icon-slot="light"></span>
    <span>Claro</span>
  </button>
</div>
