<article class="bio-unified-card">
  <!-- Zona Superior: Identidade & Apresentação -->
  <header class="bio-hero-band">
    <div class="bio-avatar-wrapper">
      <img id="bio-avatar" src="" alt="Leandro Cardoso" class="bio-avatar-img" />
    </div>
    <div class="bio-identity">
      <h1 class="bio-name" id="bio-name"></h1>
      <p class="bio-role" id="bio-role-title"></p>
      <p class="bio-subtitle" id="bio-subtitle"></p>
    </div>
  </header>

  <!-- Zona Intermediária: Narrativa / Filosofia de Engenharia -->
  <div class="bio-narrative-band">
    <div class="bio-narrative-label">
      <span class="bio-accent-dot"></span>
      <h2 class="bio-heading" id="bio-heading"></h2>
    </div>
    <div class="bio-paragraphs" id="bio-paragraphs"></div>
  </div>

  <!-- Zona Inferior: Base Acadêmica & Idiomas integrados -->
  <div class="bio-credentials-band">
    <div id="bio-education-slot"></div>
    <div id="bio-languages-slot"></div>
  </div>
</article>
