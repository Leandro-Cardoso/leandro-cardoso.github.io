<section class="projects-view">
  <header class="projects-header">
    <div class="projects-titles">
      <h1 class="projects-title">Projetos</h1>
      <p class="projects-subtitle">Repositórios, sistemas, motores gráficos, aplicações web, ferramentas, bibliotecas, scripts, jogos...</p>
    </div>

    <div id="search-slot" class="projects-search-slot"></div>
  </header>

  <div class="projects-toolbar no-print">
    <div id="category-filters" class="category-filters"></div>
    <button id="filter-featured-btn" class="filter-favorites-btn" type="button">
      ⭐ Destaques (<span id="featured-count">0</span>)
    </button>
  </div>

  <div id="projects-grid" class="projects-grid"></div>

  <div id="projects-empty" class="projects-empty" style="display: none;">
    <p>Nenhum projeto encontrado com os termos pesquisados.</p>
  </div>
</section>
