<section class="contacts-view">
  <header class="contacts-header">
    <h1 id="contacts-title" class="contacts-title"></h1>
    <p id="contacts-subtitle" class="contacts-subtitle"></p>
    <div id="contacts-location-badge" class="contacts-location-badge" style="display: none;"></div>
  </header>

  <div class="contacts-container">
    <div class="contacts-card">
      <h2 class="contacts-section-heading">Canais Oficiais</h2>
      <div class="contacts-list" id="contacts-channels-list"></div>
    </div>

    <div class="contacts-card" id="contacts-map-card" style="display: none;">
      <div class="contacts-map-header">
        <h2 class="contacts-section-heading">Localização</h2>
        <span class="contacts-map-label" id="contacts-map-label"></span>
      </div>
      <div class="contacts-map-wrapper">
        <iframe
          id="contacts-map-iframe"
          class="contacts-map-iframe"
          title="Localização no Mapa"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
</section>
